    <title>OBS Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
      }

      .transparent-mode,
      .transparent-mode body,
      .transparent-mode #stage {
        background: transparent;
      }

      @font-face {
        font-family: FZChaoCuHei;
        src: url("FZCCHJW.TTF") format("truetype");
        font-display: swap;
      }

      @font-face {
        font-family: FZLanTingHei;
        src: url("%E5%85%B0%E4%BA%AD%E7%89%B9%E9%BB%91%E7%AE%80.TTF")
          format("truetype");
        font-display: swap;
      }

      #canvas {
        position: absolute;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
      }

      .asset {
        position: absolute;
        display: block;
        transform-origin: top left;
        filter: hue-rotate(var(--hue, 0deg));
      }

      .text {
        position: absolute;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        white-space: pre-wrap;
        overflow: visible;
        outline: none;
        line-height: normal;
      }

      #editor {
        position: fixed;
        z-index: 9999;
        top: 12px;
        right: 12px;
        width: min(360px, calc(100vw - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        background: rgba(15, 18, 24, 0.96);
        color: #fff;
        padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        font:
          12px/1.4 Arial,
          sans-serif;
        display: none;
      }

      #editor h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 6px 0;
      }
      select,
      input {
        font: inherit;
        box-sizing: border-box;
      }
      select {
        width: 100%;
        padding: 5px;
        background: #222;
        color: #fff;
        border: 1px solid #444;
      }
      .item {
        border-top: 1px solid #333;
        padding: 8px 0;
      }
      .item label {
        display: block;
        color: #aaa;
        margin-bottom: 4px;
      }
      .item input[type="text"] {
        width: 100%;
        padding: 5px;
        background: #111;
        color: #fff;
        border: 1px solid #444;
      }
      .item input[type="range"] {
        width: 100%;
      }
      .text-options {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 5px;
      }
      .text-options label {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 0;
        color: #fff;
      }
      .text-size {
        width: 72px;
        padding: 3px;
        background: #111;
        color: #fff;
        border: 1px solid #444;
      }
      .muted {
        color: #888;
        font-size: 11px;
      }
    </style>
  </head>

      const qs = new URLSearchParams(location.search);
      if (qs.get("transparent") === "1")
        document.documentElement.classList.add("transparent-mode");
      const editor = document.getElementById("editor");
      const presetSelect = document.getElementById("preset");
      const canvas = document.getElementById("canvas");
      const controls = document.getElementById("controls");
      let current = qs.get("preset") || presets[0].id;
      const state = {};
      const sceneSnapshots = {};
      const stagedSnapshots = {};
      let activeScene = qs.get("scene") || null;

      presets.forEach((p) => {
        state[p.id] = {
          texts: Object.fromEntries(
            p.texts.map((t) => [
              t.id,
              { value: t.text, visible: true, fontSize: t.style.fontSize },
            ]),
          ),
          hues: Object.fromEntries(p.images.map((i) => [i.id, 0])),
        };
      });

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function fit() {
        const s = Math.min(innerWidth / 1920, innerHeight / 1080);
        canvas.style.transform = `scale(${s})`;
      }

      function render() {
        const p = presets.find((x) => x.id === current) || presets[0];
        const st = state[p.id];
        canvas.innerHTML = "";
        p.images.forEach((i) => {
          const e = document.createElement("img");
          e.className = "asset";
          e.src = i.src;
          e.alt = "";
          e.dataset.id = i.id;
          const [x, y, right, bottom] = i.box;
          e.style.left = x + "px";
          e.style.top = y + "px";
          e.style.width = right - x + "px";
          e.style.height = bottom - y + "px";
          e.style.setProperty("--hue", (st.hues[i.id] || 0) + "deg");
          canvas.appendChild(e);
        });
        p.texts.forEach((t) => {
          const ts = st.texts[t.id];
          const e = document.createElement("div");
          e.className = "text";
          e.contentEditable = "true";
          e.dataset.id = t.id;
          e.hidden = !ts.visible;
          e.textContent = ts.value;
          const [x, y, w, h] = t.box;
          e.style.left = x + "px";
          e.style.top = y + "px";
          e.style.width = w - x + "px";
          e.style.height = h - y + "px";
          e.style.fontFamily = t.style.fontFamily;
          e.style.fontSize = ts.fontSize + "px";
          e.style.color = t.style.fontColor;
          e.style.fontWeight = t.style.fontWeight;
          e.style.fontStyle = t.style.fontStyle;
          e.style.textAlign = t.style.textAlign;
          e.style.justifyContent =
            t.style.textAlign === "center"
              ? "center"
              : t.style.textAlign === "right"
                ? "flex-end"
                : "flex-start";
          e.style.letterSpacing = t.style.tracking + "px";
          e.addEventListener("input", () => {
            ts.value = e.textContent;
          });
          canvas.appendChild(e);
        });
        renderControls(p);
      }

      function renderControls(p) {
        controls.innerHTML = "";
        const st = state[p.id];
        const heading = document.createElement("div");
        heading.className = "item";
        heading.innerHTML = "<label>背景图层 Hue</label>";
        controls.appendChild(heading);
        p.images.forEach((i) => {
          const d = document.createElement("div");
          d.className = "item";
          d.innerHTML = `<label>${esc(i.group.concat(i.name).join(" / "))}</label><input type="range" min="-180" max="180" value="${st.hues[i.id] || 0}">`;
          d.querySelector("input").addEventListener("input", (ev) => {
            st.hues[i.id] = ev.target.value;
            const e = canvas.querySelector(`[data-id="${i.id}"]`);
            e.style.setProperty("--hue", ev.target.value + "deg");
          });
          controls.appendChild(d);
        });
        const th = document.createElement("div");
        th.className = "item";
        th.innerHTML = "<label>文字内容、显示与字号</label>";
        controls.appendChild(th);
        p.texts.forEach((t) => {
          const ts = st.texts[t.id];
          const d = document.createElement("div");
          d.className = "item";
          d.innerHTML = `<div class="text-options"><label><input class="text-visible" type="checkbox" ${ts.visible ? "checked" : ""}>显示</label><input class="text-size" type="number" min="1" max="300" step="0.1" value="${ts.fontSize}" title="字号"></div><label>${esc(t.group.concat(t.name).join(" / "))}</label><input type="text" value="${esc(ts.value)}">`;
          d.querySelector(".text-visible").addEventListener("change", (ev) => {
            ts.visible = ev.target.checked;
            const e = canvas.querySelector(`[data-id="${t.id}"]`);
            e.hidden = !ts.visible;
          });
          d.querySelector(".text-size").addEventListener("input", (ev) => {
            const size = Math.max(
              1,
              Math.min(300, Number(ev.target.value) || 1),
            );
            ts.fontSize = size;
            ev.target.value = size;
            const e = canvas.querySelector(`[data-id="${t.id}"]`);
            e.style.fontSize = size + "px";
          });
          d.querySelector("input[type=text]").addEventListener(
            "input",
            (ev) => {
              ts.value = ev.target.value;
              const e = canvas.querySelector(`[data-id="${t.id}"]`);
              e.textContent = ev.target.value;
            },
          );
          controls.appendChild(d);
        });
      }

      const TEXT_INDEX = {
        header_brand: 0,
        header_match_type: 1,
        header_round: 2,
        header_theme: 3,
      };

      function presetId(template) {
        return String(template || "").replaceAll("_", "-");
      }

      function currentPreset() {
        return presets.find((p) => p.id === current) || presets[0];
      }

      function setTextValue(p, index, value) {
        const text = p.texts[index];
        if (!text || value === undefined || value === null) return;
        const st = state[p.id].texts[text.id];
        st.value = String(value);
        const element = canvas.querySelector(`[data-id="${text.id}"]`);
        if (element) element.textContent = st.value;
      }

      function applyBusinessTexts(values) {
        const p = currentPreset();
        for (const [key, index] of Object.entries(TEXT_INDEX)) {
          if (values[key] !== undefined) setTextValue(p, index, values[key]);
        }
        if (p.id.endsWith("-bpl")) {
          const fields = [
            ["left_team_name", 4], ["left_points", 5], ["left_player", 6],
            ["right_team_name", 7], ["right_points", 8], ["right_player", 9],
          ];
          fields.forEach(([key, index]) => setTextValue(p, index, values[key]));
        } else {
          for (let machine = 1; machine <= 4; machine += 1) {
            setTextValue(p, machine + 3, values[`machine_${machine}_player`]);
          }
        }
      }

      function applyHueValue(imageId, degrees) {
        const value = Number(degrees);
        if (!Number.isFinite(value)) return;
        const st = state[currentPreset().id];
        st.hues[imageId] = value;
        const element = canvas.querySelector(`[data-id="${imageId}"]`);
        if (element) element.style.setProperty("--hue", `${value}deg`);
      }

      function applyBusinessHues(hues) {
        const p = currentPreset();
        const applyGroup = (key, indexes) => {
          if (hues[key] === undefined) return;
          indexes.forEach((index) => {
            if (p.images[index]) applyHueValue(p.images[index].id, hues[key]);
          });
        };
        if (hues.all !== undefined) {
          p.images.forEach((image) => applyHueValue(image.id, hues.all));
        }
        if (p.id.endsWith("-bpl")) {
          applyGroup("left", [1, 2, 3]);
          applyGroup("right", [4, 5, 6]);
        } else {
          for (let machine = 1; machine <= 4; machine += 1) {
            applyGroup(`machine_${machine}`, [machine]);
          }
        }
      }

      function applyBusinessMessage(message) {
        if (!message) return;
        const data = message.data || message;
        if (message.cmd === "stage") {
          const snapshot = data.snapshot || {};
          if (data.scene) stagedSnapshots[data.scene] = snapshot;
          sendAck(message, true);
          return;
        }
        if (message.cmd === "activate") {
          const scene = data.scene;
          const snapshot = scene && (stagedSnapshots[scene] || sceneSnapshots[scene]);
          if (scene) activeScene = scene;
          if (snapshot) {
            sceneSnapshots[scene] = snapshot;
            const next = presetId(snapshot.template);
            if (next && presets.some((p) => p.id === next)) current = next;
            render();
            applyBusinessTexts(snapshot.texts || {});
            applyBusinessHues(snapshot.hues || {});
          }
          sendAck(message, true);
          return;
        }
        const next = presetId(data.template);
        const targetScene = data.scene || activeScene;
        if (targetScene) {
          sceneSnapshots[targetScene] = {
            template: data.template || current.replaceAll("-", "_"),
            texts: data.texts || data.values || {},
            hues: data.hues || data.values || {},
          };
        }
        if (next && presets.some((p) => p.id === next) && next !== current && (!targetScene || targetScene === activeScene)) {
          current = next;
          render();
        }
        if ((message.cmd === "round_start" || message.cmd === "round_result") && (!targetScene || targetScene === activeScene)) {
          applyBusinessTexts(data.texts || {});
          applyBusinessHues(data.hues || {});
        } else if (message.cmd === "set_text") {
          applyBusinessTexts(data.values || data.texts || {});
        } else if (message.cmd === "set_hue") {
          applyBusinessHues(data.values || data.hues || { all: data.hue });
        }
      }

      function sendAck(message, ok, error) {
        const relay = window.overlayRelaySocket;
        if (!relay || relay.readyState !== WebSocket.OPEN || !message || !message.request_id) return;
        relay.send(JSON.stringify({
          cmd: "ack",
          request_id: message.request_id,
          ok: !!ok,
          error: error || null,
        }));
      }

      function connectBusinessRelay() {
        const host = location.hostname || "localhost";
        const socket = new WebSocket(`ws://${host}:8082`);
        window.overlayRelaySocket = socket;
        socket.onmessage = (event) => {
          try { applyBusinessMessage(JSON.parse(event.data)); }
          catch (error) { console.error("Invalid overlay message", error); }
        };
        socket.onclose = () => setTimeout(connectBusinessRelay, 3000);
      }

      presets.forEach((p) => {
        const o = document.createElement("option");
        o.value = p.id;
        o.textContent = p.label;
        presetSelect.appendChild(o);
      });
      presetSelect.value = current;
      presetSelect.addEventListener("change", () => {
        current = presetSelect.value;
        history.replaceState(
          null,
          "",
          "?preset=" + current + (qs.get("edit") ? "&edit=1" : ""),
        );
        render();
      });
      if (qs.get("edit") === "1") editor.style.display = "block";
      addEventListener("resize", fit);
      fit();
      render();
      connectBusinessRelay();
    </script>
