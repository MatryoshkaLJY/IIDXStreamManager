{% extends "base.html" %}
{% block page_id %}review{% endblock %}
{% block content %}
<div class="card" id="no-session">
  <h2>比分确认</h2>
  <p>当前没有进行中的回合。</p>
</div>

<div id="live-area" class="hidden">
  <div class="card">
    <h2 id="live-title">比赛进行中</h2>
    <div class="cabinet-grid" id="cabinet-grid"></div>
    <div class="row" style="margin-top:14px">
      <button class="big" id="capture-btn" onclick="captureScores(this)">📸 抓取所有机台分数</button>
    </div>
    <div id="test-score-panel" class="test-score-panel hidden">
      <h3>测试模式：模拟机台出分</h3>
      <div id="test-score-forms"></div>
    </div>
    <div class="hint">选手成绩画面停留时点击按钮，并行抓取所有游玩机台；抓分后进入确认环节，未识别到的成绩可对照截图补录。</div>
    <div style="margin-top:14px">
      <button class="secondary" onclick="toggleManual()">抓分失败？手动录入</button>
      <div id="manual-entry" class="hidden" style="margin-top:10px">
        <table><tr><th>选手</th><th id="manual-score-header">EX 分</th></tr><tbody id="manual-rows"></tbody></table>
        <div class="row" style="margin-top:10px">
          <button onclick="submitManual()">进入比分确认</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="review-area" class="hidden">
  <div class="card">
    <h2>确认比分（可修改）</h2>
    <div class="score-screenshots" id="score-screenshots"></div>
    <table>
      <tr><th>选手</th><th>机台</th><th>侧</th><th id="review-score-header">EX 分</th></tr>
      <tbody id="score-rows"></tbody>
    </table>
    <div class="verdict" id="verdict"></div>
    <div class="row">
      <button class="secondary" id="recapture-btn" onclick="captureScores(this)">🔄 重新抓分</button>
      <button class="big" id="confirm-score-btn" onclick="confirmScores()">✓ 创建计分板待应用</button>
    </div>
  </div>
</div>

<div id="pushed-area" class="hidden">
  <div class="card">
    <h2>已写入记分板</h2>
    <div class="verdict" id="pushed-verdict"></div>
    <div class="row">
      <button class="secondary" id="repush-btn" onclick="repush()">重试推送</button>
      <button class="big" onclick="advance()">进入下一回合 →</button>
    </div>
  </div>
</div>

<div id="end-area" class="hidden">
  <div class="card">
    <h2>🏁 比赛结束</h2>
    <div id="end-detail"></div>
    <button class="secondary" onclick="postJSON('/api/match/abort')">清理并返回</button>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
const cabinets = {};

window.onSessionUpdate = function (snap) {
  const session = snap.session;
  const phase = session ? session.phase : 'IDLE';
  for (const id of ['no-session', 'live-area', 'review-area', 'pushed-area', 'end-area']) {
    document.getElementById(id).classList.add('hidden');
  }
  if (!session || phase === 'IDLE') {
    document.getElementById('no-session').classList.remove('hidden');
  } else if (phase === 'PREP') {
    window.location.href = '/prep';
  } else if (phase === 'LIVE') {
    document.getElementById('live-area').classList.remove('hidden');
    manualPlayers = session.round ? session.round.players : [];
    currentJudgeBy = (session.round && session.round.judge_by) || 'ex';
    renderLiveTitle(session.round);
    renderCabinets(snap);
    renderTestScorePanel(session, snap);
  } else if (phase === 'REVIEW') {
    document.getElementById('review-area').classList.remove('hidden');
    renderReview(session, snap);
  } else if (phase === 'PUSHED') {
    document.getElementById('pushed-area').classList.remove('hidden');
    document.getElementById('pushed-verdict').innerHTML = verdictHtml(session.last_result, session.round);
    const isGrab = !!(session.round && session.round.grab);
    const waiting = !!snap.pending;
    const silent = !!session.last_silent;
    document.querySelector('#pushed-area h2').textContent =
      isGrab ? '抢夺赛结果已记录（不上计分板）'
        : (silent ? '本局结果已记录（局间不上计分板）'
          : (waiting ? '等待应用计分板' : '已写入计分板'));
    document.getElementById('repush-btn').classList.toggle('hidden', waiting || isGrab);
    document.querySelector('#pushed-area button.big').disabled = waiting;
  } else if (phase === 'MATCH_END') {
    document.getElementById('end-area').classList.remove('hidden');
    renderEnd(session);
  }
};

window.onCabinetUpdate = function (data) {
  cabinets[data.machine_id] = data;
  const cell = document.getElementById('cab-' + cssSafe(data.machine_id));
  if (cell) {
    const parts = [data.label, data.state].filter(Boolean);
    cell.querySelector('.st').textContent =
      (parts.length ? parts.join(' / ') : '-') + (data.scores ? '　✓ 已抓分' : '');
  }
};

async function captureScores(btn) {
  const button = btn || document.getElementById('capture-btn');
  setButtonBusy(button, true, '并行抓分中…');
  try {
    const resp = await postJSON('/api/scores/capture', {});
    if (!resp.success) return;
    const failed = Object.entries(resp.failed || {});
    if (failed.length) {
      toast('抓分失败：' + failed.map(([m, e]) => `${m}（${e}）`).join('；'), true);
    } else {
      toast(`已抓分 ${(resp.captured || []).length} 台机台`);
    }
  } finally {
    setButtonBusy(button, false);
  }
}

function cssSafe(s) { return String(s).replace(/[^a-zA-Z0-9]/g, '_'); }

let manualPlayers = [];
let currentJudgeBy = 'ex';

function scoreMetricLabel() { return currentJudgeBy === 'bp' ? 'BP' : 'EX 分'; }

function toggleManual() {
  const area = document.getElementById('manual-entry');
  area.classList.toggle('hidden');
  if (area.classList.contains('hidden')) return;
  document.getElementById('manual-score-header').textContent = scoreMetricLabel();
  const tbody = document.getElementById('manual-rows');
  tbody.innerHTML = '';
  for (const player of manualPlayers) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><b>${esc(player)}</b></td>
      <td><input class="manual-ex" type="number" data-player="${esc(player)}"></td>`;
    tbody.appendChild(tr);
  }
}

async function submitManual() {
  const scores = {};
  let valid = true;
  document.querySelectorAll('.manual-ex').forEach(input => {
    const v = parseInt(input.value);
    if (isNaN(v)) { toast('请输入有效分数', true); valid = false; }
    scores[input.dataset.player] = v;
  });
  if (!valid) return;
  await postJSON('/api/round/force_review', { scores });
}

function renderLiveTitle(round) {
  if (round.mode !== 'team') {
    document.getElementById('live-title').textContent = `${esc(round.group)} 组第 ${round.round_no} 局进行中`;
    return;
  }
  const gameInfo = round.total_games > 1 ? `　第 ${round.game_no}/${round.total_games} 局` : '';
  const tieInfo = round.tiebreaker ? '（加赛）' : '';
  const bpInfo = round.judge_by === 'bp' ? '　· 比 BP（miss count 少者胜）' : '';
  document.getElementById('live-title').textContent =
    `第 ${round.round_no}/${round.total_rounds} 回合${gameInfo}${tieInfo}进行中（${esc(round.type)} ${esc(round.theme || '')}）${bpInfo}`;
}

function renderCabinets(snap) {
  const grid = document.getElementById('cabinet-grid');
  grid.innerHTML = '';
  for (const m of snap.machines) {
    const div = document.createElement('div');
    div.className = 'cabinet-cell';
    div.id = 'cab-' + cssSafe(m);
    div.innerHTML = `<div class="mid">${esc(m)}</div><div class="st">-</div>`;
    grid.appendChild(div);
  }
}

function renderTestScorePanel(session, snap) {
  const panel = document.getElementById('test-score-panel');
  panel.classList.toggle('hidden', !snap.test_mode);
  if (!snap.test_mode) return;
  const metric = (session.round && session.round.judge_by) === 'bp' ? ' BP' : '';
  const forms = document.getElementById('test-score-forms');
  const machines = [...new Set(Object.values(session.assignments).map(slot => slot.machine))];
  forms.innerHTML = '';
  for (const machine of machines) {
    const players = Object.entries(session.assignments)
      .filter(([, slot]) => slot.machine === machine)
      .map(([player, slot]) => `${esc(slot.side)}: ${esc(player)}`).join('，');
    const row = document.createElement('div');
    row.className = 'test-score-row';
    row.innerHTML = `
      <b>${esc(machine)}</b><span>${players}</span>
      <label>1P${metric} <input class="test-score-input" data-side="1p" type="number" min="0"></label>
      <label>2P${metric} <input class="test-score-input" data-side="2p" type="number" min="0"></label>
      <button type="button">提交</button>`;
    row.querySelector('button').onclick = () => submitTestScores(machine, row);
    forms.appendChild(row);
  }
}

async function submitTestScores(machine, row) {
  const scores = {};
  row.querySelectorAll('.test-score-input').forEach(input => {
    if (input.value !== '') scores[input.dataset.side] = parseInt(input.value);
  });
  if (!Object.keys(scores).length || Object.values(scores).some(Number.isNaN)) {
    toast('请至少填写一个有效分数', true);
    return;
  }
  const button = row.querySelector('button');
  setButtonBusy(button, true, '提交中…');
  try {
    await postJSON('/api/test/scores', { machine_id: machine, scores });
  } finally {
    setButtonBusy(button, false);
  }
}

function verdictHtml(result, round) {
  if (!result) return '';
  if (result.mode === 'team') {
    const w = result.winner === 'draw' ? '平局' : (result.winner === 'left' ? '左队胜' : '右队胜');
    let prefix = '判定';
    if (round && round.total_games > 1) {
      prefix = `第 ${round.game_no}/${round.total_games} 局判定`;
    }
    if (round && round.tiebreaker) {
      prefix = '加赛判定';
    }
    if (round && round.grab) {
      prefix = '抢夺赛判定';
    }
    return `${prefix}：左 ${result.left_points} — 右 ${result.right_points}（${w}）`;
  }
  const ranking = result.ranking || [];
  const ranks = result.ranks || {};
  return '名次：' + ranking.map(p => {
    const r = ranks[p];
    return r ? `${esc(p)}(第${r}名)` : esc(p);
  }).join(' &gt; ');
}

function renderReview(session, snap) {
  document.getElementById('manual-entry').classList.add('hidden');
  const judgeBy = (session.round && session.round.judge_by) || 'ex';
  document.getElementById('review-score-header').textContent = judgeBy === 'bp' ? 'BP' : 'EX 分';
  renderScreenshots(session, snap.screenshots || {});
  const tbody = document.getElementById('score-rows');
  tbody.innerHTML = '';
  const scores = (session.last_result && session.last_result.scores) || {};
  for (const [player, slot] of Object.entries(session.assignments)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${esc(player)}</b></td>
      <td>${esc(slot.machine)}</td><td>${esc(slot.side)}</td>
      <td><input class="ex-input" type="number" data-player="${esc(player)}" value="${scores[player] ?? ''}"></td>`;
    tbody.appendChild(tr);
  }
  const incomplete = (session.last_result && session.last_result.incomplete) || [];
  const verdictEl = document.getElementById('verdict');
  if (incomplete.length) {
    verdictEl.innerHTML =
      `<span class="warn-list">未识别到成绩：${incomplete.map(esc).join('、')}，请对照截图补录或重新抓分后再确认</span>`;
  } else {
    verdictEl.innerHTML = verdictHtml(session.last_result, session.round);
  }
}

function renderScreenshots(session, screenshots) {
  const area = document.getElementById('score-screenshots');
  area.innerHTML = '';
  const seen = new Set();
  for (const [player, slot] of Object.entries(session.assignments)) {
    const machine = slot.machine;
    if (seen.has(machine)) continue;
    seen.add(machine);
    const wrapper = document.createElement('figure');
    wrapper.className = 'score-screenshot';
    const caption = document.createElement('figcaption');
    const players = Object.entries(session.assignments)
      .filter(([, assigned]) => assigned.machine === machine)
      .map(([name]) => name).join('、');
    caption.textContent = `${machine}　${players}`;
    wrapper.appendChild(caption);
    if (screenshots[machine]) {
      const image = document.createElement('img');
      image.src = screenshots[machine] + `?t=${Date.now()}`;
      image.alt = `${machine} 成绩界面`;
      wrapper.appendChild(image);
    } else {
      const empty = document.createElement('div');
      empty.className = 'screenshot-empty';
      empty.textContent = '暂无成绩截图（可能为手动录入）';
      wrapper.appendChild(empty);
    }
    area.appendChild(wrapper);
  }
}

async function confirmScores() {
  const scores = {};
  let valid = true;
  document.querySelectorAll('.ex-input').forEach(input => {
    const v = parseInt(input.value);
    if (isNaN(v)) { toast(`请输入有效分数`, true); valid = false; }
    scores[input.dataset.player] = v;
  });
  if (!valid) return;
  const button = document.getElementById('confirm-score-btn');
  setButtonBusy(button, true, '切换计分板并等待…');
  try {
    const resp = await postJSON('/api/round/confirm', { scores });
    if (resp.success) {
      if (resp.grab) {
        toast(resp.grab_done
          ? '抢夺赛已全部结束，请在下一回合页面录入初始 PT'
          : '抢夺赛结果已记录（不上计分板）');
      } else if (resp.continued) {
        toast('本局已记录，请准备下一局');
      } else {
        toast('已创建计分板待应用，请在顶部确认');
      }
    }
  } finally {
    setButtonBusy(button, false);
  }
}

async function repush() {
  const button = document.getElementById('repush-btn');
  setButtonBusy(button, true, '等待计分板动画…');
  try {
    const resp = await postJSON('/api/round/repush');
    if (resp.success) toast('已创建重推待应用，请在顶部确认');
  } finally {
    setButtonBusy(button, false);
  }
}

async function advance() {
  const resp = await postJSON('/api/round/advance');
  if (resp.success && !resp.match_end) window.location.href = '/prep';
}

function renderEnd(session) {
  const summary = session.summary || {};
  let html;
  if (session.mode !== 'team' && summary.final_ranking) {
    const medals = ['🥇', '🥈', '🥉', '4.'];
    html = '<p>' + summary.final_ranking.map((p, i) => `${medals[i] || ''} ${esc(p)}`).join('<br>') + '</p>';
  } else if (session.mode === 'team') {
    html = `<p>共完成 ${(summary.team_rounds || []).length} 回合。</p>`;
  } else {
    html = '<p>全部赛程已完成。</p>';
  }
  document.getElementById('end-detail').innerHTML = html;
}
</script>
{% endblock %}
