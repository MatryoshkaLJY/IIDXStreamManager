<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080,initial-scale=1">
  <title>IIDX 场景叠加层</title>
  <style>
    :root { color-scheme: only light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #viewport { position: fixed; inset: 0; overflow: hidden; transform-origin: 0 0; }
    #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
    #layer-stack { position: absolute; inset: 0; }
    .layer-image, .text-node {
      position: absolute;
      display: block;
      padding: 0;
      margin: 0;
      user-select: none;
    }
    .layer-image { object-fit: fill; pointer-events: none; }
    .text-node {
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: pre;
      line-height: 1;
      text-align: left;
      transform-origin: left center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <main id="stage" aria-hidden="true"><div id="layer-stack"></div></main>
  </div>
  <script src="manifest.js"></script>
  <script>
    const CANVAS = { width: 1920, height: 1080 };
    const queryTemplate = new URLSearchParams(window.location.search).get('template');
    const stack = document.getElementById('layer-stack');
    const viewport = document.getElementById('viewport');
    const state = {
      manifest: null,
      template: queryTemplate || 'dp_bpl',
      textNodes: new Map(),
      hueNodes: new Map(),
      values: {},
      hues: {}
    };

    function fitViewport() {
      const scale = Math.min(window.innerWidth / CANVAS.width, window.innerHeight / CANVAS.height);
      viewport.style.width = `${CANVAS.width * scale}px`;
      viewport.style.height = `${CANVAS.height * scale}px`;
      viewport.style.transform = `scale(${scale})`;
    }

    function safeText(value) {
      return value === null || value === undefined ? '' : String(value);
    }

    function applyFit(node) {
      const base = Number(node.dataset.fontSize || 16);
      node.style.fontSize = `${base}px`;
      if (node.scrollWidth <= node.clientWidth + 1) return;
      let size = base;
      while (size > base * 0.55 && node.scrollWidth > node.clientWidth + 1) {
        size -= 0.5;
        node.style.fontSize = `${size}px`;
      }
    }

    function injectFonts(manifest) {
      const style = document.createElement('style');
      style.textContent = (manifest.fonts || []).map(font =>
        `@font-face{font-family:${JSON.stringify(font.family)};src:url(${JSON.stringify(font.src)}) format('truetype');font-display:block;}`
      ).join('\n');
      document.head.appendChild(style);
    }

    function position(node, layer) {
      node.style.left = `${layer.x}px`;
      node.style.top = `${layer.y}px`;
      node.style.width = `${layer.width}px`;
      node.style.height = `${layer.height}px`;
    }

    function makeImage(layer) {
      const node = document.createElement('img');
      node.className = 'layer-image';
      node.alt = '';
      position(node, layer);
      node.src = layer.src;
      if (layer.hueKey) state.hueNodes.set(layer.hueKey, node);
      return node;
    }

    function makeText(layer) {
      const node = document.createElement('div');
      node.className = 'text-node';
      node.dataset.fontSize = layer.fontSize;
      node.dataset.layerId = layer.id;
      position(node, layer);
      node.style.fontFamily = `"${layer.fontFamily || 'Arial'}", "${layer.fontFallback || 'Arial'}", Arial, sans-serif`;
      node.style.fontWeight = layer.fontWeight || 400;
      node.style.color = layer.color || '#fff';
      node.style.textAlign = layer.textAlign || 'left';
      node.style.alignItems = layer.verticalAlign === 'top' ? 'flex-start' : 'center';
      node.style.transform = `scaleX(${layer.horizontalScale || 1})`;
      state.textNodes.set(layer.id, node);
      return node;
    }

    function applyValues(values) {
      for (const [id, value] of Object.entries(values || {})) {
        const node = state.textNodes.get(id);
        if (!node) continue;
        state.values[id] = safeText(value);
        node.textContent = state.values[id];
        applyFit(node);
      }
    }

    function applyHues(values) {
      for (const [key, value] of Object.entries(values || {})) {
        const node = state.hueNodes.get(key);
        if (!node) continue;
        const degrees = Number(value) || 0;
        state.hues[key] = degrees;
        node.style.filter = `hue-rotate(${degrees}deg)`;
      }
      if (values && values.all !== undefined) {
        const degrees = Number(values.all) || 0;
        for (const [key, node] of state.hueNodes) {
          state.hues[key] = degrees;
          node.style.filter = `hue-rotate(${degrees}deg)`;
        }
      }
    }

    function renderTemplate(template) {
      const item = state.manifest.templates[template] || state.manifest.templates.dp_bpl;
      state.template = state.manifest.templates[template] ? template : 'dp_bpl';
      stack.replaceChildren();
      state.textNodes.clear();
      state.hueNodes.clear();
      for (const layer of item.layers) {
        const node = layer.kind === 'text' ? makeText(layer) : makeImage(layer);
        if (layer.kind === 'text') node.textContent = layer.default || '';
        stack.appendChild(node);
      }
      applyValues(state.values);
      applyHues(state.hues);
    }

    function inferValues(data) {
      const values = { ...(data.texts || {}) };
      const round = data.round || {};
      if (round.round_no !== undefined) values.header_round = `ROUND ${round.round_no}`;
      if (round.theme) values.header_theme = round.theme;
      if (round.left_team) values.left_team_name = round.left_team;
      if (round.right_team) values.right_team_name = round.right_team;
      if (round.left_players) values.left_player = round.left_players.join(' / ');
      if (round.right_players) values.right_player = round.right_players.join(' / ');
      for (const entry of data.entries || []) {
        const match = String(entry.machine || '').match(/([1-4])/);
        if (match) values[`machine_${match[1]}_player`] = entry.player || '';
      }
      const result = data.result || {};
      if (result.left_points !== undefined) values.left_points = `${result.left_points}PT`;
      if (result.right_points !== undefined) values.right_points = `${result.right_points}PT`;
      return values;
    }

    function handleMessage(message) {
      if (!message || !message.cmd) return;
      const data = message.data || {};
      if (message.cmd === 'set_text') {
        if (data.template) renderTemplate(data.template);
        applyValues(data.values || data.texts || {});
        return;
      }
      if (message.cmd === 'set_hue') {
        if (data.template) renderTemplate(data.template);
        applyHues(data.values || data.hues || { all: data.hue });
        return;
      }
      if (message.cmd === 'round_start' || message.cmd === 'round_result') {
        if (data.template) renderTemplate(data.template);
        applyValues(inferValues(data));
        return;
      }
      if (message.cmd === 'match_end' && data.texts) applyValues(data.texts);
    }

    function connect() {
      const socket = new WebSocket('ws://localhost:8082');
      socket.onmessage = event => {
        try { handleMessage(JSON.parse(event.data)); } catch (error) { console.error(error); }
      };
      socket.onclose = () => setTimeout(connect, 3000);
    }

    window.addEventListener('resize', fitViewport);
    window.iidxOverlay = { handleMessage, renderTemplate, state };
    fitViewport();
    const manifest = window.IIDX_SCENE_MANIFEST;
    if (manifest) {
      state.manifest = manifest;
      injectFonts(manifest);
      renderTemplate(state.template);
      connect();
    } else {
      fetch('manifest.json')
        .then(response => response.json())
        .then(data => { state.manifest = data; injectFonts(data); renderTemplate(state.template); connect(); })
        .catch(error => console.error('Unable to load scene manifest', error));
    }
  </script>
</body>
</html>
